name: JuiceIsland

# The app target is only App/Main/main.swift, the Focus filter (App/Main/QuietFocusFilter.swift, P1006) and the app
# icon (App/Main/Resources/Assets.xcassets, drawn by scripts/make-icon.swift). Everything it draws is the SwiftPM library
# JuiceIslandUI (App/ minus App/Main, in the root Package.swift), so streams render and test with `swift test` and never
# edit this file.
# Build: xcodegen generate && xcodebuild -project JuiceIsland.xcodeproj -scheme JuiceIsland -configuration Debug \
#          -derivedDataPath output/dd.noindex CODE_SIGNING_ALLOWED=NO build
# The widget extension (spec §4.7) is Widget/ alone, its @main bundle; its views and timeline are JuiceIslandUI's
# (App/Widget). It is embedded in the app's PlugIns. App and widget share the App Group TEAMID0000.<the app's bundle id>
# (team-prefixed: no provisioning profile) and the app handles the URL scheme <the app's bundle id>, so the release build
# and a dev build never read each other's snapshot or answer each other's links (P342, P345).

options:
  bundleIdPrefix: com.ofengenden
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  JuiceIsland:
    path: .
  JuiceCore:
    path: JuiceCore

targets:
  JuiceIsland:
    type: application
    platform: macOS
    sources:
      - path: App/Main
    dependencies:
      - package: JuiceIsland
        product: JuiceIslandUI
      - package: JuiceIsland
        product: IslandEngine
      - package: JuiceCore
        product: JuiceCore
      - target: JuiceIslandWidget
        embed: true
    info:
      path: output/Info.plist
      properties:
        CFBundleName: Juice Island
        CFBundleDisplayName: Juice Island
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSUIElement: false
        # Exact jumps drive Terminal, iTerm and Ghostty with AppleScript; macOS shows this in the Automation prompt.
        NSAppleEventsUsageDescription: Juice Island brings a session's own terminal tab forward when you jump to it.
        NSPrincipalClass: NSApplication
        # A widget's tap (WidgetLink): <scheme>://session/<id>, <scheme>://open.
        CFBundleURLTypes:
          - CFBundleURLName: $(JI_BUNDLE_ID)
            CFBundleURLSchemes:
              - $(JI_BUNDLE_ID)
        JIAppGroup: $(JI_APP_GROUP)
        JIURLScheme: $(JI_BUNDLE_ID)
    entitlements:
      path: output/JuiceIsland.entitlements
      properties:
        com.apple.security.application-groups:
          - $(JI_APP_GROUP)
    settings:
      base:
        # scripts/build-app.sh --prod overrides these two on the command line (com.ofengenden.juice, Juice Island).
        # They are only referenced here and in the widget, so the override never reaches the package targets.
        JI_BUNDLE_ID: com.ofengenden.juice.dev
        JI_PRODUCT_NAME: Juice Island Dev
        JI_APP_GROUP: TEAMID0000.$(JI_BUNDLE_ID)
        PRODUCT_BUNDLE_IDENTIFIER: $(JI_BUNDLE_ID)
        PRODUCT_NAME: $(JI_PRODUCT_NAME)
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The desktop and Notification Center widget: sandboxed, reading only the App Group's snapshot (spec §4.7).
  JuiceIslandWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
    dependencies:
      - package: JuiceIsland
        product: JuiceIslandUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: output/Widget-Info.plist
      properties:
        CFBundleName: JuiceIslandWidget
        CFBundleDisplayName: $(JI_PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        JIAppGroup: $(JI_APP_GROUP)
        JIURLScheme: $(JI_BUNDLE_ID)
    entitlements:
      path: output/JuiceIslandWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(JI_APP_GROUP)
    settings:
      base:
        # The app's identity, overridden with it by scripts/build-app.sh --prod: the widget is <the app's id>.widget.
        JI_BUNDLE_ID: com.ofengenden.juice.dev
        JI_PRODUCT_NAME: Juice Island Dev
        JI_APP_GROUP: TEAMID0000.$(JI_BUNDLE_ID)
        PRODUCT_BUNDLE_IDENTIFIER: $(JI_BUNDLE_ID).widget
        PRODUCT_NAME: JuiceIslandWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # Xcode 27 refuses an app extension built with this off ("Application extensions and any libraries they link to
        # must be built with APPLICATION_EXTENSION_API_ONLY set to YES"). Its code is the JuiceIslandUI library, which
        # the app shares; the widget calls none of the AppKit that an extension may not.
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  JuiceIsland:
    build:
      targets:
        JuiceIsland: all
